<script>
    let button = document.getElementById('botao-tema');

    function alternar() {
       //seleciona a imagem usando id
        let imagem = document.getElementById('Luminaria');

        //se a imagem esta oculta
        if (imagem.style.display === 'none') {
            imagem.style.display = 'block'; // mostra a imagem
            button.textContent = 'esconder'; // troca texto botão
        }else{ // se a imagem estiver visivel
            imagem.style.display = 'none'; // esconde imagem
            button.textContent = 'mostrar'; // troca o texto do botão
        }
    }
    button.addEventListener('click', alternar);
</script>
