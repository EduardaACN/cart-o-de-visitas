<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formularios</title>
</head>
<body>
<h1>Formularios</h1>
<p>Aula sobre formularios em html</p>

<form id="form">
  <label for="nome">Nome:</label>
  <br/>
  <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Digite seu nome"
          required
  >
  <br/>
  <label for="senha">Senha:</label>
  <br/>
  <input
          type="password"
          id="senha"
          name="senha"
          placeholder="Digite sua senha"
          required
  >
  <br/>
  <input
          type="radio"
          id="amarelo"
          name="amarelo"
          value="amarelo">
  <br/>
  <input id= "enviar" type="submit" value="Enviar">
</form>
</body>
<script type="application/javascript">
  function dizer_ola(event) {
    event.preventDefault();
    let nome = document.getElementById('nome').value;
    let senha = document.getElementById('senha').value;
    alert('Ola ' + nome + '! sua senha é ' + senha + '!');
  }
  document
          .getElementById('form')
          .addEventListener('submit', dizer_ola);

</script>
</html>
