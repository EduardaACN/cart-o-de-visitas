<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>aaaa</h1>
<p>aaaa</p>

<img
    id="imagem_principal"
    src="https://inovaveterinaria.com.br/wp-content/uploads/2017/09/gato-srd.jpg"
    width="370"
>
<br/>
<br/>
<img src="https://inovaveterinaria.com.br/wp-content/uploads/2017/09/gato-srd.jpg" class="menor"width="120">
<img src="https://inovaveterinaria.com.br/wp-content/uploads/2016/01/Gato-persa-INOVA-scaled.jpg" class="menor"width="120">
<img src="https://www.bonsfluidos.com.br/wp-content/uploads/2026/01/CAPA-BONS-FLUIDOS-2026-01-29T124219.250.jpg" class="menor"width="120">
</body>
<script>
    let principal = document.getElementById("imagem_principal"); // 1 elemento
    let imagens= document.getElementsByClassName("menor"); // array com 3 elementos

    for(let i=0; i<imagens.length; i++){
        imagens[i].addEventListener('mouseover', () => {
            principal.src = imagens[i].src;
        });
    }
</script>
</html>
